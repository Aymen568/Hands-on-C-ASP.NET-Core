name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
          include-prerelease: true

      - name: Restore
        run: dotnet restore Projects.sln

      - name: Build
        run: dotnet build Projects.sln --no-restore

      - name: Test
        run: dotnet test Projects.sln --no-build --verbosity normal
